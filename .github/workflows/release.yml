name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml   # reuse the CI test job

  release:
    needs: test
    runs-on: ubuntu-24.04
    env:
      # Job-level env: the `secrets` context is NOT allowed in step-level
      # `if:` conditions (workflow-parse failure) — expose it here and gate
      # the publish step on env.WEBSITE_PAT instead.
      WEBSITE_PAT: ${{ secrets.WEBSITE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          echo "APP_VERSION=$(python3 -c "import sys;sys.path.insert(0,'src/api');import version;print(version.APP_VERSION)")" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section for release notes
        id: notes
        run: |
          python3 scripts/changelog_section.py "${{ steps.ver.outputs.APP_VERSION }}" > /tmp/notes.md
          echo "notes_size=$(wc -c < /tmp/notes.md)" >> "$GITHUB_OUTPUT"

      - name: Build release manifest + tarball
        run: |
          python3 scripts/build_release_manifest.py --out /tmp/release-dist \
            --changelog "https://github.com/Ridge-Chapel-Tech/barenoc-appliance/releases/tag/v${{ steps.ver.outputs.APP_VERSION }}"
          ls -la /tmp/release-dist

      - name: Collect release assets + checksums
        run: |
          mkdir -p /tmp/assets
          cp install.sh proxmox/barenoc-appliance.sh proxmox/build_barenoc_iso.sh \
             proxmox/setup-usb-backup.sh /tmp/assets/
          cp /tmp/release-dist/* /tmp/assets/
          ( cd /tmp/assets && sha256sum * > SHA256SUMS )
          ls -la /tmp/assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.APP_VERSION }}"
          gh release create "v${VERSION}" /tmp/assets/* \
            --title "v${VERSION}" \
            --notes-file /tmp/notes.md

      # Publish versions.json + the release tarball to barenoc.com via the
      # BareNOC-Website push-to-deploy repo (downloads/ -> Hostinger).
      # BareNOC is free & open — no activation-key gating.
      - name: Publish to barenoc.com (versions.json + tarball)
        if: env.WEBSITE_PAT != ''
        env:
          VERSION: ${{ steps.ver.outputs.APP_VERSION }}
        run: |
          git clone -q "https://x-access-token:${WEBSITE_PAT}@github.com/Ridge-Chapel-Tech/BareNOC-Website.git" /tmp/site
          mkdir -p /tmp/site/downloads
          cp /tmp/release-dist/* /tmp/site/downloads/
          cd /tmp/site
          git config user.email "release@barenoc.com"
          git config user.name "BareNOC Release"
          git add downloads/
          git commit -q -m "release v${VERSION}: manifest + tarball" || true
          git push -q
          echo "published v${VERSION} -> barenoc.com/downloads (auto-deploy via website repo)"
