server {
    listen 443 ssl;
    server_name barenoc.local app.barenoc.com;

    ssl_certificate /etc/nginx/certs/barenoc.crt;
    ssl_certificate_key /etc/nginx/certs/barenoc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Optional client-cert verification: normal clients (no cert) pass; the
    # device API location below requires a valid cert from the BareNOC CA.
    ssl_verify_client optional;
    ssl_client_certificate /etc/nginx/certs/ca-root.crt;

    client_max_body_size 10M;

    # Docker embedded DNS — re-resolve api at request time so container IP
    # changes don't strand nginx on a stale address.
    resolver 127.0.0.11 valid=10s;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Device API — requires a valid device certificate (from the BareNOC CA).
    # The verified subject DN is passed as X-SSL-Client-DN (nginx strips any
    # client-supplied X-SSL-* headers; the api parses the CN from the DN).
    location /api/v1/device/ {
        if ($ssl_client_verify != "SUCCESS") { return 403; }
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # step-cli binary for device enrollment (self-contained; no internet needed)
    location = /step-cli {
        alias /opt/barenoc/volumes/static/step;
    }
    location = /step-cli-darwin_amd64 {
        alias /opt/barenoc/volumes/static/step-cli-darwin_amd64;
    }
    location = /step-cli-darwin_arm64 {
        alias /opt/barenoc/volumes/static/step-cli-darwin_arm64;
    }

    # API proxy
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        # Heavy endpoints (UniFi sync: login + stat/device + clients + DB
        # upserts) can exceed the 60s nginx default; without this the user
        # gets an HTML 504 page and the web UI shows a cryptic JSON.parse
        # error instead of the actual result.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Web UI (HTMX pages)
    location / {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Pocket ID (OIDC / passkeys) — served at ROOT on its own port. The SvelteKit
# SPA emits root-absolute asset/API paths (/api, /_app), so a path prefix like
# /auth/pocket-id/ renders a blank page; a root listener is the supported form.
server {
    listen 8443 ssl;
    server_name barenoc.local pocket-id.barenoc.local app.barenoc.com;

    ssl_certificate /etc/nginx/certs/barenoc.crt;
    ssl_certificate_key /etc/nginx/certs/barenoc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;
    resolver 127.0.0.11 valid=10s;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        set $pocketid_upstream pocket-id:1411;
        proxy_pass http://$pocketid_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# step-ca (device certificates) — device enrollment + ACME endpoints on its own
# hostname. Devices reach it at https://stepca.barenoc.local:8443; the CA root
# cert (SAN: stepca.barenoc.local) is what nginx trusts for device mTLS.
server {
    listen 8443 ssl;
    server_name stepca.barenoc.local;

    ssl_certificate /etc/nginx/certs/stepca-intermediate.crt;
    ssl_certificate_key /etc/nginx/certs/stepca-intermediate.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;
    resolver 127.0.0.11 valid=10s;

    location / {
        set $stepca_upstream step-ca:443;
        proxy_pass https://$stepca_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
