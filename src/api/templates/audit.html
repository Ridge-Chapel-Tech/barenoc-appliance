{% extends "base.html" %}
{% block title %}BareNOC — Audit Log{% endblock %}
{% block inner_content %}
<div id="audit-app">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-gray-900">Audit Log</h1>
      <p class="mt-1 text-sm text-gray-500">Immutable, hash-chained record of every security-relevant event.</p>
    </div>
    <div class="flex gap-2">
      <button onclick="verifyChain()" class="rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50">Verify chain</button>
      <button onclick="exportAudit()" class="rounded-md bg-barenoc-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-barenoc-700">Export JSON</button>
    </div>
  </div>

  <div id="audit-chain" class="mt-3 text-sm"></div>

  <div class="mt-4 flex flex-wrap items-center gap-3 text-sm">
    <input id="audit-filter-event" class="rounded-md border-gray-300 border px-3 py-1.5 text-sm" placeholder="event type (e.g. login, settings_change)">
    <input id="audit-filter-actor" class="rounded-md border-gray-300 border px-3 py-1.5 text-sm" placeholder="actor">
    <button onclick="loadAudit()" class="rounded-md bg-gray-600 px-3 py-1.5 text-sm font-semibold text-white">Filter</button>
    <span id="audit-count" class="text-xs text-gray-500"></span>
  </div>

  <div class="mt-4 bg-white shadow rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-2 text-left font-medium text-gray-500">When (UTC)</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Event</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Actor</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Ticket</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Data</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Hash</th>
        </tr>
      </thead>
      <tbody id="audit-body"></tbody>
    </table>
  </div>
</div>

<script>
function getToken() { return localStorage.getItem('access_token'); }
function esc(t) { if (t === null || t === undefined) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadAudit() {
  var ev = document.getElementById('audit-filter-event').value.trim();
  var actor = document.getElementById('audit-filter-actor').value.trim();
  var qs = new URLSearchParams({ limit: 500 });
  if (ev) qs.set('event_type', ev);
  if (actor) qs.set('actor', actor);
  try {
    var r = await fetch('/api/v1/audit-log?' + qs.toString(), { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    renderChain(d.chain || {});
    document.getElementById('audit-count').textContent = (d.total || 0) + ' event(s)';
    var body = document.getElementById('audit-body');
    body.innerHTML = (d.rows || []).map(function(a) {
      var data = typeof a.data === 'string' ? a.data : JSON.stringify(a.data || {});
      if (data.length > 120) data = data.slice(0, 120) + '…';
      return '<tr class="hover:bg-gray-50 align-top">'
        + '<td class="px-4 py-2 font-mono text-xs whitespace-nowrap">' + esc(a.timestamp) + '</td>'
        + '<td class="px-4 py-2"><span class="px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-700">' + esc(a.event_type) + '</span></td>'
        + '<td class="px-4 py-2">' + esc(a.actor) + '</td>'
        + '<td class="px-4 py-2 font-mono text-xs">' + esc(a.ticket_id || '') + '</td>'
        + '<td class="px-4 py-2 font-mono text-xs text-gray-600">' + esc(data) + '</td>'
        + '<td class="px-4 py-2 font-mono text-[10px] text-gray-400">' + esc((a.sha256_hash || '').slice(0, 12)) + '</td>'
        + '</tr>';
    }).join('');
  } catch (e) {
    document.getElementById('audit-chain').textContent = '❌ ' + e.message;
  }
}

function renderChain(c) {
  var el = document.getElementById('audit-chain');
  if (c.ok) {
    el.innerHTML = '<span class="text-green-700 font-medium">✓ Chain intact</span> '
      + '<span class="text-gray-500">(' + (c.count || 0) + ' events, '
      + esc(c.first_ts || '') + ' → ' + esc(c.last_ts || '') + ')</span>';
  } else {
    el.innerHTML = '<span class="text-red-700 font-medium">✗ Chain broken at id ' + (c.broken_at || '?') + '</span> '
      + '<span class="text-gray-500">' + esc(c.error || '') + '</span>';
  }
}

async function verifyChain() {
  try {
    var r = await fetch('/api/v1/audit-log/verify', { headers: { 'Authorization': 'Bearer ' + getToken() } });
    var d = await r.json();
    renderChain(d);
  } catch (e) { alert('Verify failed: ' + e.message); }
}

function exportAudit() {
  window.location.href = '/api/v1/audit-log/export';
}
</script>
{% endblock %}
