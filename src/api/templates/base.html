<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BareNOC{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/response-targets.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        barenoc: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                        }
                    }
                }
            }
        }
    </script>
    <style>[x-cloak]{display:none!important}</style>
    {% block head %}{% endblock %}
</head>
<body class="h-full" x-data="{ sidebarOpen: false }">
    <script>
        // Global auth guard: a 401 from any API call means the access token
        // (60-min lifetime) is expired or invalid — bounce to the login page
        // instead of surfacing raw "Invalid or expired token" errors on fetch
        // calls (HTMX already handles this via htmx:responseError).
        (function () {
            var origFetch = window.fetch;
            window.fetch = function () {
                return origFetch.apply(this, arguments).then(function (r) {
                    if (r.status === 401 &&
                        !/^\/(login|change-password)\b/.test(window.location.pathname)) {
                        try { localStorage.removeItem('access_token'); } catch (e) {}
                        document.cookie = 'access_token=; Max-Age=0; path=/';
                        window.location.href = '/login';
                    }
                    return r;
                });
            };
        })();
    </script>
    {% if request.cookies.get('access_token') %}
    <div class="min-h-full">
        <!-- Mobile top bar -->
        <div class="fixed inset-x-0 top-0 z-40 flex h-16 items-center justify-between bg-barenoc-800 px-4 md:hidden">
            <button type="button" @click="sidebarOpen = true" class="rounded-md p-2 text-gray-300 hover:bg-barenoc-700 hover:text-white" aria-label="Open navigation menu">
                <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="text-white font-bold text-xl">BareNOC</div>
            <span class="w-6"></span>
        </div>

        <!-- Mobile overlay -->
        <div x-cloak x-show="sidebarOpen" @click="sidebarOpen = false"
             class="fixed inset-0 z-30 bg-black/50 md:hidden"
             x-transition:enter="transition-opacity ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"></div>

        <!-- Sidebar -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
               class="fixed inset-y-0 left-0 z-40 flex w-60 flex-col border-r border-barenoc-700/50 bg-barenoc-800 transition-transform duration-300 ease-in-out md:translate-x-0"
               aria-label="Primary navigation">
            <div class="flex h-16 items-center gap-2 px-5">
                <div class="text-white font-bold text-xl">BareNOC</div>
                <span id="barenooc-version" class="text-xs text-gray-400 border border-gray-600 rounded px-1.5 py-0.5"></span>
                <button type="button" @click="sidebarOpen = false" class="ml-auto rounded-md p-1.5 text-gray-400 hover:bg-barenoc-700 hover:text-white md:hidden" aria-label="Close navigation menu">
                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <nav class="flex-1 space-y-1 overflow-y-auto px-3 pb-4">
                <a href="/dashboard" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path == '/dashboard' %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                    Dashboard
                </a>
                <a href="/tickets" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path == '/tickets' %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
                    Tickets
                </a>
                <a href="/chat" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path == '/chat' %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                    Chat <span class="text-[10px] uppercase tracking-wide text-gray-500">mobile</span>
                </a>
                <a href="/devices" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path == '/devices' %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
                    Devices
                </a>
                <a href="/system" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path == '/system' %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
                    System
                </a>
                <a href="/admin" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path == '/admin' %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg>
                    LLM Monitor
                </a>
                <a href="/settings" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path == '/settings' %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
                    Settings
                </a>
                <a href="/wiki" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path.startswith('/wiki') %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    Wiki
                </a>
                <a href="/downloads" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-barenoc-700 hover:text-white {% if request.url.path == '/downloads' %}bg-barenoc-700 text-white{% endif %}">
                    <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    Downloads
                </a>
            </nav>
            <div class="border-t border-barenoc-700 px-4 py-4">
                <div class="flex items-center justify-between gap-3">
                    <span id="user-display" class="min-w-0 truncate text-sm text-gray-300"></span>
                    <button onclick="logout()" class="shrink-0 text-sm text-gray-300 hover:text-white">Logout</button>
                </div>
            </div>
        </aside>

        <!-- Content -->
        <div class="pt-16 md:pt-0 md:pl-60">
            <main>
                <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
                    {% block inner_content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // Check auth on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Show the appliance version in the nav (public endpoint)
            fetch('/api/v1/health')
                .then(r => r.json())
                .then(d => { document.getElementById('barenooc-version').textContent = 'v' + (d.version || ''); })
                .catch(() => {});

            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            // Display username
            const payload = JSON.parse(atob(token.split('.')[1]));
            document.getElementById('user-display').textContent = payload.sub || '';

            // Bounce forced password-change users to /change-password
            fetch('/api/v1/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(r => {
                    if (r.status === 403) return r.json().then(d => {
                        if (d.detail === 'password_change_required' && !window.location.pathname.startsWith('/change-password')) {
                            window.location.href = '/change-password';
                        }
                    });
                })
                .catch(() => {});
        });

        function logout() {
            localStorage.removeItem('access_token');
            document.cookie = 'access_token=; Max-Age=0; path=/';
            window.location.href = '/login';
        }

        // Add auth header to all HTMX requests
        document.addEventListener('htmx:configRequest', function(e) {
            const token = localStorage.getItem('access_token');
            if (token) {
                e.detail.headers['Authorization'] = 'Bearer ' + token;
            }
        });

        // Handle HTMX auth errors
        document.addEventListener('htmx:responseError', function(e) {
            if (e.detail.xhr.status === 401) {
                localStorage.removeItem('access_token');
                window.location.href = '/login';
            }
        });
    </script>
    {% else %}
        {% block content %}{% endblock %}
    {% endif %}
</body>
</html>
