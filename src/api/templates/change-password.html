{% extends "base.html" %}
{% block title %}BareNOC — Change Password{% endblock %}
{% block inner_content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-semibold text-gray-900">Change Password</h1>
    <p class="mt-1 text-sm text-gray-500">An administrator has required you to set a new password before continuing.</p>

    <div class="mt-6 bg-white shadow rounded-lg p-6">
        <div id="notice" class="hidden mb-4 px-4 py-3 rounded text-sm"></div>
        <form id="pw-form" class="space-y-4" onsubmit="handleChange(event)">
            <div>
                <label for="current-password" class="block text-sm font-medium text-gray-700">Current Password</label>
                <input id="current-password" name="current_password" type="password" required class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 text-sm">
            </div>

            <div>
                <label for="new-password" class="block text-sm font-medium text-gray-700">New Password</label>
                <input id="new-password" name="new_password" type="password" required minlength="8" class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 text-sm">
                <p class="mt-1 text-xs text-gray-400">At least 8 characters, different from your current password.</p>
            </div>

            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm New Password</label>
                <input id="confirm-password" type="password" required class="mt-1 block w-full rounded-md border-gray-300 border px-3 py-2 text-sm">
            </div>

            <button type="submit" class="w-full rounded-md bg-barenoc-600 px-4 py-2 text-sm font-semibold text-white hover:bg-barenoc-700">Update Password</button>
        </form>
    </div>
</div>

<script>
function getToken() { return localStorage.getItem('access_token'); }
function showNotice(text, ok) {
    const el = document.getElementById('notice');
    el.textContent = text;
    el.className = 'mb-4 px-4 py-3 rounded text-sm ' + (ok ? 'bg-green-50 border border-green-200 text-green-700' : 'bg-red-50 border border-red-200 text-red-700');
    el.classList.remove('hidden');
}

async function initPage() {
    try {
        const r = await fetch('/api/v1/auth/me', { headers: { 'Authorization': 'Bearer ' + getToken() } });
        if (r.ok) { window.location.href = '/dashboard'; return; }        // no longer forced
        if (r.status === 401) { window.location.href = '/login'; return; } // not authenticated
        // 403 = password_change_required -> show the form
    } catch (e) {
        showNotice('Cannot verify your session. Please log out and try again.', false);
    }
}

async function handleChange(event) {
    event.preventDefault();
    const current = document.getElementById('current-password').value;
    const next = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    if (next !== confirm) { showNotice('New passwords do not match.', false); return; }
    if (next.length < 8) { showNotice('New password must be at least 8 characters.', false); return; }

    try {
        const r = await fetch('/api/v1/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify({ current_password: current, new_password: next }),
        });
        const d = await r.json();
        if (!r.ok) { showNotice(d.detail || 'Failed to change password', false); return; }
        showNotice('Password updated. Redirecting...', true);
        setTimeout(() => { window.location.href = '/dashboard'; }, 800);
    } catch (e) {
        showNotice('Network error. Is the server running?', false);
    }
}

document.addEventListener('DOMContentLoaded', initPage);
</script>
{% endblock %}
