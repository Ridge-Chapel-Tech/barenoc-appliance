<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup — BareNOC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { barenoc: {
            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af' } } } } };
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-2xl mx-auto px-4 py-6">

  <div class="flex items-center justify-between gap-3 mb-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-barenoc-700 text-white flex items-center justify-center font-bold">B</div>
      <div>
        <div class="text-lg font-bold leading-tight">Welcome to BareNOC</div>
        <div class="text-xs text-gray-500">A few quick steps and your network can answer for itself.</div>
      </div>
    </div>
    <button onclick="toggleAdvanced()" id="adv-toggle" class="shrink-0 text-xs text-gray-400 underline hover:text-gray-600">Advanced setup</button>
  </div>

  <!-- step dots + counter -->
  <div id="dots" class="flex items-center gap-1.5 mb-1"></div>
  <div id="progress" class="text-xs text-gray-500 mb-4"></div>

  <!-- current step card -->
  <div id="step" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5"></div>

  <!-- navigation -->
  <div id="nav" class="flex items-center justify-between mt-5"></div>

  <div id="done" class="hidden mt-6 bg-white rounded-2xl shadow p-6 text-center">
    <div class="text-4xl mb-2">🎉</div>
    <div class="font-semibold">You're all set!</div>
    <p class="text-sm text-gray-500 mt-1">Your network is live. Share the chat link below so family &amp; tenants can reach the Queue Manager.</p>
    <div id="done-url" class="mt-3 text-sm font-mono text-barenoc-700 break-all"></div>
    <a href="/dashboard" class="inline-block mt-4 rounded-lg bg-barenoc-600 px-5 py-2.5 text-sm font-semibold text-white">Go to dashboard</a>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let STATUS = null;
let cur = 0; // current step index
let noSession = false; // set when an API call 401s with no usable session

// Send the Bearer token only when we actually have one; otherwise the browser's
// session cookie (e.g. from a /login page sign-in) authenticates the request.
// Sending "Bearer null" used to produce a confusing "Invalid or expired token".
function authHeaders() {
  const t = localStorage.getItem('access_token');
  const h = { 'Content-Type': 'application/json' };
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}

// Fetch with auth; on a 401 drop a stale wizard token and retry via the
// session cookie (a /login sign-in outlives the wizard's own token).
async function authedFetch(path, opts) {
  let r = await fetch(path, Object.assign({ headers: authHeaders() }, opts || {}));
  if (r.status === 401 && localStorage.getItem('access_token')) {
    localStorage.removeItem('access_token');
    r = await fetch(path, Object.assign({ headers: authHeaders() }, opts || {}));
  }
  return r;
}

async function api(path, opts) {
  const r = await authedFetch(path, opts);
  const b = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) {
      noSession = true;
      render();
      throw new Error('Session expired or missing — sign in first (see the link above), then try again.');
    }
    throw new Error(b.detail || ('HTTP ' + r.status));
  }
  return b;
}

const TZ_OPTIONS = ['UTC','America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','America/Anchorage','Pacific/Honolulu','Europe/London','Europe/Berlin','Australia/Sydney','Asia/Tokyo'];

// ── Two presentations, one engine ──────────────────────────────────────────
// EXPRESS (default) = 4 steps; every skipped step writes a correct default at
// finish + a "Configure" link into Settings. ADVANCED = the full 9-step path.
// required = must be done to move forward (Next stays disabled until saved);
// optional steps advance via "Skip for now" without marking done.
const EXPRESS_STEPS = [
  { key: 'account', title: 'Your admin account', sub: 'Set your username + password — the first login on this appliance.', icon: '👤', required: true },
  { key: 'network', title: 'Your network (UniFi)', sub: 'BareNOC discovers your gear from your router — add its credentials or skip.', icon: '📡', required: false },
  { key: 'share',   title: 'Name it & share the chat', sub: 'Site name, the AI technician, and the chat link for the family.', icon: '💬', required: false },
  { key: 'done',    title: 'You\'re ready', sub: 'Review the defaults and start watching your network.', icon: '🎉', required: false },
];

const ADVANCED_STEPS = [
  { key: 'account',   title: 'Your admin account', sub: 'Set your username + password — the first login on this appliance.', icon: '👤', required: true },
  { key: 'llm',       title: 'AI technician (LLM)', sub: 'The brain that answers tickets. Add a provider API key, or skip and add one later in Settings → API Keys.', icon: '🧠', required: false },
  { key: 'timezone',  title: 'Timezone', sub: 'Used for reports, alerts and “what time is it”.', icon: '🕐', required: true },
  { key: 'site_name', title: 'Site name', sub: 'Shown on the chat page and in email.', icon: '🏠', required: true },
  { key: 'email',     title: 'Alert email', sub: 'Where P1/P2 alerts and digests go.', icon: '📧', required: true },
  { key: 'autonomy',  title: 'Autonomy', sub: 'How much the AI does on its own. Home default: fully autonomous.', icon: '🤖', required: true },
  { key: 'backups',   title: 'Backups', sub: 'Your data is backed up automatically — nothing to do.', icon: '💾', required: false },
  { key: 'devices',   title: 'Adopt your first device', sub: 'Add a laptop/NAS/switch so BareNOC can act on it.', icon: '🖥️', required: false },
  { key: 'share',     title: 'Share the chat link', sub: 'Point family & tenants at the chat URL.', icon: '🔗', required: false },
];

let ADVANCED = false; // the "Advanced setup" expander restores the full path
let detectedTZ = '';
try { detectedTZ = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
let expressSite = '';   // site name collected on the express share step
let aiChoice = 'cloud'; // the express LLM two-choice card (== compliance llm_egress)
let uniFiDefaultUrl = '';

function steps() { return ADVANCED ? ADVANCED_STEPS : EXPRESS_STEPS; }
function isSkippable(s) {
  if (!ADVANCED) return s.key === 'network' || s.key === 'share';
  return s.key === 'llm' || s.key === 'devices';
}
function stepDone(s) {
  if (!ADVANCED && s.key === 'share') return STATUS.steps.site_name === true;
  if (!ADVANCED && s.key === 'done') return false;
  return STATUS.steps[s.key] === true;
}
function expressFirstUndone() {
  if (STATUS.steps.account !== true) return 0;
  if (STATUS.steps.network !== true) return 1;
  if (STATUS.steps.site_name !== true) return 2;
  return 3;
}
function validTz(tz) {
  if (!tz) return false;
  return tz === 'UTC' || /^[A-Za-z_]+(\/[A-Za-z0-9_+\-]+)+$/.test(tz);
}
function toggleAdvanced() {
  ADVANCED = !ADVANCED;
  cur = 0;
  const t = document.getElementById('adv-toggle');
  if (t) t.textContent = ADVANCED ? 'Simple setup' : 'Advanced setup';
  loadStatus();
}

async function loadStatus() {
  try { STATUS = await api('/api/v1/setup/status'); }
  catch (e) { $('progress').textContent = 'Loading setup…'; return; }
  if (STATUS.complete) {
    $('done').classList.remove('hidden');
    $('done-url').textContent = STATUS.chat_url;
    $('dots').innerHTML = ''; $('progress').textContent = '';
    $('step').innerHTML = ''; $('nav').innerHTML = '';
    return;
  }
  // land on the first step that still needs doing
  const firstUndone = ADVANCED
    ? ADVANCED_STEPS.findIndex(s => STATUS.steps[s.key] !== true)
    : expressFirstUndone();
  cur = firstUndone === -1 ? 0 : firstUndone;
  render();
}

function render() {
  const s = steps()[cur];
  const done = stepDone(s);
  // banner: the wizard needs a session (account step mints one; a /login
  // sign-in works too) — offer a one-tap link when it's missing/expired
  if (noSession && s.key !== 'account') {
    $('nav').innerHTML = '<div class="w-full rounded-lg bg-amber-50 border border-amber-300 px-4 py-3 text-sm text-amber-800">'
      + 'Your session expired. <a href="/login" class="font-semibold underline">Sign in</a> once, then come back — your progress is saved.</div>';
    return;
  }
  // progress dots: current = wide blue, done = green, todo = gray (done dots are clickable)
  $('dots').innerHTML = steps().map((st, i) => {
    const d = stepDone(st);
    return '<button onclick="jumpTo(' + i + ')" title="' + esc(st.title) + '" class="h-2 rounded-full transition-all ' +
      (i === cur ? 'w-6 bg-barenoc-600' : d ? 'w-2 bg-green-500' : 'w-2 bg-gray-300') + '"></button>';
  }).join('');
  $('progress').textContent = 'Step ' + (cur + 1) + ' of ' + steps().length + ' — ' + s.title + (done ? ' ✓' : '');
  // step card
  $('step').innerHTML = '<div class="flex items-start gap-3">'
    + '<div class="text-3xl">' + s.icon + '</div>'
    + '<div class="flex-1 min-w-0">'
    + '<div class="font-semibold text-base">' + esc(s.title) + (done ? ' <span class="text-green-600 text-sm">✓</span>' : '') + '</div>'
    + '<div class="text-xs text-gray-500 mt-0.5">' + s.sub + '</div>'
    + '<div id="step-body" class="mt-4">' + editorFor(s) + '</div>'
    + '</div></div>';
  if (s.key === 'backups') loadBackupsStep();
  if (!ADVANCED && s.key === 'network') loadNetworkDefaults();
  if (!ADVANCED && s.key === 'share') aiEgressMode();
  // navigation
  const nextDisabled = s.required && !done;
  $('nav').innerHTML = (cur > 0
      ? '<button onclick="backStep()" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">← Back</button>'
      : '<span></span>')
    + '<div class="flex items-center gap-3">'
    + (isSkippable(s) && !done
        ? '<button onclick="skipStep()" class="text-xs text-gray-500 underline">Skip for now</button>' : '')
    + (cur < steps().length - 1
        ? '<button onclick="nextStep()" ' + (nextDisabled ? 'disabled' : '') + ' class="rounded-lg px-4 py-2 text-sm font-semibold text-white ' + (nextDisabled ? 'bg-gray-300 cursor-not-allowed' : 'bg-barenoc-600 hover:bg-barenoc-700') + '">Next →</button>'
        : '<button onclick="finishSetup()" class="rounded-xl bg-green-600 px-5 py-2.5 text-sm font-bold text-white hover:bg-green-700">✓ Finish setup</button>')
    + '</div>';
}

// ----- editors (always visible for the current step) -----

function editorFor(s) {
  if (!ADVANCED) return expressEditorFor(s);
  if (s.key === 'account') {
    if (STATUS.steps.account === true)
      return '<p class="text-sm text-gray-600">Admin account is set. Change your password any time in Settings → Users.</p>';
    return accountForm();
  }
  if (s.key === 'llm') return llmForm();
  if (s.key === 'timezone') return tzForm();
  if (s.key === 'site_name') return siteForm();
  if (s.key === 'email') return emailForm();
  if (s.key === 'autonomy') return autonomyForm();
  if (s.key === 'backups') return '<div class="text-sm text-gray-500">Loading backup status…</div>';
  if (s.key === 'devices') return devicesEditor();
  if (s.key === 'share') return shareEditor();
  return '';
}

// ----- express editors (4-step home path) -----

function expressEditorFor(s) {
  if (s.key === 'account') {
    if (STATUS.steps.account === true)
      return '<p class="text-sm text-gray-600">Admin account is set ✓. Change your password any time in Settings → Advanced → Users.</p>';
    return accountForm();
  }
  if (s.key === 'network') return networkForm();
  if (s.key === 'share') return shareForm();
  if (s.key === 'done') return doneForm();
  return '';
}

function networkForm() {
  return '<div class="space-y-2 text-sm">'
    + '<p class="text-xs text-gray-400">BareNOC auto-discovers your network gear from your UniFi controller (usually your router). Add its credentials now — or skip: discovery works as soon as they\'re saved in Settings → Network.</p>'
    + '<label class="block text-xs font-medium text-gray-600">Controller URL</label>'
    + '<input id="f-net-url" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="https://<gateway>:443" value="' + esc(uniFiDefaultUrl) + '">'
    + '<label class="block text-xs font-medium text-gray-600">Username</label>'
    + '<input id="f-net-user" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="admin" value="admin">'
    + '<label class="block text-xs font-medium text-gray-600">Password or API key</label>'
    + '<input id="f-net-pass" type="password" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="controller local password or API key" autocomplete="off">'
    + '<div class="flex items-center gap-3">'
    + '<button onclick="saveNetwork()" class="mt-3 rounded-lg bg-barenoc-600 px-4 py-2 text-xs font-semibold text-white">Save &amp; discover</button>'
    + '<span id="net-preview" class="mt-3 text-xs"></span>'
    + '</div>'
    + '<div id="net-devices" class="text-xs text-gray-500 mt-2"></div>'
    + '<p class="text-xs text-gray-400 mt-2">Configure more (auto-adopt, sync interval, multiple sites) in Settings → Network.</p>'
    + '</div>';
}

function shareForm() {
  const siteVal = expressSite || (STATUS.site_name !== 'BareNOC' ? STATUS.site_name : '');
  return '<div class="space-y-3 text-sm">'
    + '<label class="block text-xs font-medium text-gray-600">Site name</label>'
    + '<input id="f-share-site" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="e.g. The Smith House" value="' + esc(siteVal) + '">'
    + '<div class="rounded-lg border border-gray-200 p-3">'
    + '<p class="text-xs font-semibold">AI technician</p>'
    + '<label class="flex items-start gap-2 text-xs mt-1"><input type="radio" name="f-ai-egress" value="cloud"' + (aiChoice === 'cloud' ? ' checked' : '') + ' onchange="aiEgressMode()"> Cloud (recommended — best answers)</label>'
    + '<label class="flex items-start gap-2 text-xs mt-1"><input type="radio" name="f-ai-egress" value="local"' + (aiChoice === 'local' ? ' checked' : '') + ' onchange="aiEgressMode()"> Local only — no data leaves your network (Ollama/LM Studio)</label>'
    + '<p id="f-ai-note" class="text-[11px] text-gray-400 mt-1"></p>'
    + '<div id="f-ai-cloud" class="' + (aiChoice === 'local' ? 'hidden' : '') + ' mt-2">'
    + '<label class="block text-xs font-medium text-gray-600">API key <span class="font-normal text-gray-400">(optional now — add it later in Settings → Advanced → LLM Providers)</span></label>'
    + '<input id="f-ai-key" type="password" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="sk-…" autocomplete="off">'
    + '</div>'
    + '<div id="f-ai-local" class="' + (aiChoice === 'local' ? '' : 'hidden') + ' mt-2 space-y-2">'
    + '<input id="f-ai-url" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="http://192.168.x.x:11434">'
    + '<input id="f-ai-model" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="qwen2.5:7b-instruct">'
    + '</div>'
    + '</div>'
    + '<div class="text-xs text-gray-500 break-all">Chat URL: <a class="text-barenoc-600 underline" href="' + esc(STATUS.chat_url) + '">' + esc(STATUS.chat_url) + '</a></div>'
    + '<img class="w-28 h-28 rounded-lg border border-gray-200" src="https://api.qrserver.com/v1/create-qr-code/?size=256x256&data=' + encodeURIComponent(STATUS.chat_url) + '" alt="QR">'
    + '<button onclick="saveShare()" class="rounded-lg bg-barenoc-600 px-4 py-2 text-xs font-semibold text-white">Save &amp; continue →</button>'
    + '</div>';
}

function doneForm() {
  const tz = detectedTZ || '(auto-detected)';
  const llm = aiChoice === 'local' ? 'Local only — no data leaves your network' : 'Cloud (recommended — best answers)';
  return '<div class="space-y-2 text-sm">'
    + '<p class="text-gray-600">Here\'s what BareNOC turns on for you — change any of it later in Settings.</p>'
    + '<ul class="text-xs text-gray-600 space-y-1 mt-2">'
    + '<li>🧠 AI technician: <b>' + esc(llm) + '</b></li>'
    + '<li>🕐 Timezone: <b>' + esc(tz) + '</b> (from your browser)</li>'
    + '<li>🤖 Autonomy: <b>autonomous</b> — the AI acts on its own</li>'
    + '<li>💾 Backups: <b>on</b> (local, automatic)</li>'
    + '<li>📡 Auto-discovery: <b>on</b> — new devices appear automatically</li>'
    + '<li>🔒 Remote support: <b>off</b></li>'
    + '</ul>'
    + '<p class="text-xs text-gray-400 mt-2">Click <b>Finish setup</b> below to start watching your network.</p>'
    + '</div>';
}

function aiEgressMode() {
  const mode = (document.querySelector("input[name='f-ai-egress']:checked") || {}).value || 'cloud';
  aiChoice = mode;
  const note = document.getElementById('f-ai-note');
  if (note) note.textContent = mode === 'local'
    ? 'Local-only: tickets/chat stay on your LAN. Use an Ollama/LM Studio endpoint (≥7B Q4 recommended; 3B = degraded chat only).'
    : 'Cloud routes tickets/chat to a hosted provider for the best answers. No key yet = add it later in Settings.';
  const cloud = document.getElementById('f-ai-cloud');
  const local = document.getElementById('f-ai-local');
  if (cloud) cloud.classList.toggle('hidden', mode === 'local');
  if (local) local.classList.toggle('hidden', mode !== 'local');
}

async function loadNetworkDefaults() {
  try {
    const c = await api('/api/v1/unifi/config');
    uniFiDefaultUrl = c.default_url || c.url || uniFiDefaultUrl;
    const u = $('f-net-url');
    if (u && uniFiDefaultUrl && !u.value) u.value = uniFiDefaultUrl;
    const user = $('f-net-user');
    if (user && c.username && c.username !== 'admin' && user.value === 'admin') user.value = c.username;
  } catch (e) { /* first-run / no session: keep the placeholder */ }
}

function accountForm() {
  return '<div class="space-y-2 text-sm">'
    + '<label class="block text-xs font-medium text-gray-600">Admin username</label>'
    + '<input id="f-acc-user" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="e.g. bob" autocomplete="username">'
    + '<label class="block text-xs font-medium text-gray-600">Password (8+ chars)</label>'
    + '<input id="f-acc-pw" type="password" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="••••••••" autocomplete="new-password">'
    + '<label class="block text-xs font-medium text-gray-600">Confirm password</label>'
    + '<input id="f-acc-pw2" type="password" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="••••••••" autocomplete="new-password">'
    + '<label class="block text-xs font-medium text-gray-600">Appliance login (SSH/console) <span class="font-normal text-gray-400">— leave blank to use the same password</span></label>'
    + '<input id="f-acc-ospw" type="password" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="optional, 8+ chars" autocomplete="new-password">'
    + '<p class="text-xs text-gray-400">Usernames are case-insensitive (stored lowercase). You are the administrator — change this password any time in Settings → Users.</p>'
    + '<button onclick="saveAccount()" class="rounded-lg bg-barenoc-600 px-4 py-2 text-xs font-semibold text-white">Create my admin account</button>'
    + '</div>';
}

function llmForm() {
  return '<div class="space-y-3 text-sm">'
    + '<p class="text-xs text-gray-400">The AI failover chain (up to 3 providers): BareNOC tries <b>Preferred</b> first, then <b>Secondary</b>, then <b>Tertiary</b> if one is down. Cloud providers need an API key; local Ollama needs none. Leave a slot blank to skip it — Test each before saving.</p>'
    + '<div class="rounded-lg border border-gray-200 p-3">'
    + '<p class="text-xs font-semibold">LLM egress</p>'
    + '<label class="flex items-center gap-2 text-xs mt-1"><input type="radio" name="f-llm-egress" value="cloud" checked onchange="llmEgressMode()"> Cloud — hosted provider (default for home)</label>'
    + '<label class="flex items-center gap-2 text-xs mt-1"><input type="radio" name="f-llm-egress" value="local" onchange="llmEgressMode()"> Local-only — no data leaves your network (Ollama/LM Studio)</label>'
    + '<p id="f-llm-egress-note" class="text-[11px] text-gray-400 mt-1"></p>'
    + '</div>'
    + providerSlot(1, 'Preferred', 'deepseekv4', 'https://api.deepseek.com', 'deepseek-v4-flash')
    + providerSlot(2, 'Secondary', 'ollama', 'http://192.168.x.x:11434', 'qwen2.5:3b-instruct')
    + providerSlot(3, 'Tertiary', '', '', '')
    + '<button onclick="saveLLM()" class="rounded-lg bg-barenoc-600 px-4 py-2 text-xs font-semibold text-white">Save providers</button>'
    + '</div>';
}

function llmEgressMode() {
  var mode = (document.querySelector("input[name='f-llm-egress']:checked") || {}).value || 'cloud';
  var note = document.getElementById('f-llm-egress-note');
  if (note) note.textContent = mode === 'local'
    ? 'Local-only: tickets/chat stay on your LAN. Use an Ollama/LM Studio endpoint (≥7B Q4 recommended; 3B = degraded chat only).'
    : '';
}

function providerSlot(n, label, defName, defUrl, defModel) {
  const defType = (defName === 'ollama') ? 'local' : 'cloud';
  const keyVis = defType === 'local' ? 'hidden' : '';
  return '<div class="rounded-lg border border-gray-200 p-3 space-y-2">'
    + '<div class="flex items-center justify-between"><span class="text-xs font-semibold">' + label + '</span><span id="llm-test-' + n + '" class="text-xs"></span></div>'
    + '<div class="flex gap-3 text-xs">'
    + '<label class="flex items-center gap-1"><input type="radio" name="llm-type-' + n + '" value="cloud"' + (defType === 'cloud' ? ' checked' : '') + ' onchange="llmSlotMode(' + n + ')"> Cloud</label>'
    + '<label class="flex items-center gap-1"><input type="radio" name="llm-type-' + n + '" value="local"' + (defType === 'local' ? ' checked' : '') + ' onchange="llmSlotMode(' + n + ')"> Local (Ollama)</label>'
    + '</div>'
    + '<input id="f-llm-name-' + n + '" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="provider name" value="' + defName + '">'
    + '<input id="f-llm-url-' + n + '" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="base URL (https://… or http://host:11434)" value="' + defUrl + '">'
    + '<input id="f-llm-model-' + n + '" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="chat / reasoner model" value="' + defModel + '">'
    + '<div id="llm-key-' + n + '" class="' + keyVis + '"><input id="f-llm-key-' + n + '" type="password" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="API key (cloud only)"></div>'
    + '<button onclick="testLLM(' + n + ')" class="rounded-lg bg-gray-200 px-3 py-1 text-xs font-semibold text-gray-700">Test</button>'
    + '</div>';
}

function llmSlotMode(n) {

async function saveAccount() {
  const user = $('f-acc-user').value.trim();
  const pw = $('f-acc-pw').value, pw2 = $('f-acc-pw2').value;
  const ospw = $('f-acc-ospw') ? $('f-acc-ospw').value : '';
  if (!user) { alert('Pick a username.'); return; }
  if (pw.length < 8) { alert('Password must be 8+ characters.'); return; }
  if (pw !== pw2) { alert('Passwords do not match.'); return; }
  if (ospw && ospw.length < 8) { alert('Appliance login password must be 8+ characters (or leave it blank to use the same as above).'); return; }
  try {
    const r = await fetch('/api/v1/setup/account', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pw, os_password: ospw || pw }) });
    const b = await r.json().catch(() => ({}));
    if (!r.ok) { throw new Error(b.detail || ('HTTP ' + r.status)); }
    localStorage.setItem('access_token', b.access_token);
    alert('✅ Admin account created — you are signed in as ' + b.username + '.');
    STATUS.steps.account = true;
    advance();
  } catch (e) { alert('Account: ' + e.message); }
}

async function saveLLM() {
  const providers = [];
  const order = [];
  const egress = (document.querySelector("input[name='f-llm-egress']:checked") || {}).value || 'cloud';
  for (let n = 1; n <= 3; n++) {
    const c = llmSlotConfig(n);
    if (!c.base_url || !c.chat_model) continue;
    if (c.deployment === 'hosted' && !c.api_key) {
      if (egress === 'local') continue;   // local-only: cloud slots are skipped
      alert('Slot ' + n + ': cloud provider needs an API key (or switch it to Local).'); return;
    }
    if (egress === 'local' && c.deployment === 'hosted') continue;
    providers.push(c);
    order.push(c.name);
  }
  if (!providers.length) { alert('Add at least one provider (URL + model), or Skip for now.'); return; }
  try {
    await api('/api/v1/settings/llm', { method: 'PUT', body: JSON.stringify({
      active_provider: order[0], provider_order: order, providers })});
    if (egress === 'local') {
      await api('/api/v1/compliance', { method: 'PUT', body: JSON.stringify({ controls: { llm_egress: 'local' } }) });
    }
    alert('✅ LLM failover chain saved.'); STATUS.steps.llm = true; advance();
  } catch (e) { alert('LLM: ' + e.message); }
}

// ----- express save handlers (network + share) -----

async function saveNetwork() {
  const url = $('f-net-url').value.trim();
  const user = $('f-net-user').value.trim();
  const pass = $('f-net-pass').value;
  if (!url || !pass) { alert('Controller URL + a password/API key are needed — or skip for now.'); return; }
  const payload = { url: url, username: user || 'admin', autosync_enabled: true, autosync_interval: 5, auto_adopt: true };
  // UniFi local API keys look like a long opaque token; a password is the
  // controller's local admin password. Long no-space value → API key.
  if (/^[A-Za-z0-9_\-]{20,}$/.test(pass)) payload.api_key = pass; else payload.password = pass;
  try {
    await api('/api/v1/unifi/config', { method: 'POST', body: JSON.stringify(payload) });
  } catch (e) { alert('Network: ' + e.message); return; }
  STATUS.steps.network = true;
  const prev = $('net-preview');
  let connected = false;
  try {
    const t = await api('/api/v1/unifi/test', { method: 'POST' });
    if (t.connected) {
      connected = true;
      const d = await api('/api/v1/unifi/devices');
      const el = $('net-devices');
      if (el) el.textContent = (d.devices || []).slice(0, 6).map(x => x.name || x.model || x.mac).join(' · ');
    }
  } catch (e) { /* unreachable controller — autosync retries on schedule */ }
  // Show the auto-discover preview RIGHT HERE (don't auto-advance past it).
  if (prev) {
    prev.innerHTML = connected
      ? '<span class="text-green-600">✓ connected — auto-discovery is on</span>'
      : '<span class="text-amber-600">saved — discovery will run automatically once the controller is reachable</span>';
    prev.innerHTML += ' <button onclick="advance()" class="ml-2 rounded-lg bg-barenoc-600 px-3 py-1 text-xs font-semibold text-white">Continue →</button>';
  }
}

async function saveShare() {
  expressSite = ($('f-share-site') ? $('f-share-site').value.trim() : expressSite);
  aiChoice = (document.querySelector("input[name='f-ai-egress']:checked") || {}).value || 'cloud';
  const aiKey = ($('f-ai-key') ? $('f-ai-key').value.trim() : '');
  const aiUrl = ($('f-ai-url') ? $('f-ai-url').value.trim() : '');
  const aiModel = ($('f-ai-model') ? $('f-ai-model').value.trim() : '');
  if (expressSite) {
    try {
      await api('/api/v1/settings/general', { method: 'PUT', body: JSON.stringify({ customer_name: expressSite }) });
    } catch (e) { alert('Site name: ' + e.message); return; }
  }
  // Save a usable provider NOW when one was typed; the egress toggle itself is
  // applied at /complete via the same compliance control the Security panel uses.
  if (aiChoice === 'cloud' && aiKey) {
    try {
      await api('/api/v1/settings/llm', { method: 'PUT', body: JSON.stringify({
        active_provider: 'deepseekv4', provider_order: ['deepseekv4'],
        providers: [{ name: 'deepseekv4', type: 'openai', base_url: 'https://api.deepseek.com',
                      deployment: 'hosted', chat_model: 'deepseek-v4-flash',
                      reasoner_model: 'deepseek-v4-flash', thinking: 'disabled',
                      api_key: aiKey, price_mode: 'static' }] }) });
    } catch (e) { alert('LLM key: ' + e.message); return; }
  } else if (aiChoice === 'local' && aiUrl && aiModel) {
    try {
      await api('/api/v1/settings/llm', { method: 'PUT', body: JSON.stringify({
        active_provider: 'ollama', provider_order: ['ollama'],
        providers: [{ name: 'ollama', type: 'openai', base_url: aiUrl,
                      deployment: 'on_prem', chat_model: aiModel, reasoner_model: aiModel }] }) });
    } catch (e) { alert('Local LLM: ' + e.message); return; }
  }
  STATUS.steps.site_name = true;
  advance();
}

  const msg = $('bk-net-msg');
  msg.innerHTML = '<span class="text-gray-500">connecting…</span>';
  try {
    const r = await authedFetch('/api/v1/settings/backups/net-mount', { method: 'POST', body: JSON.stringify({
      proto: $('bk-net-proto').value,
      host: $('bk-net-host').value.trim(),
      share: $('bk-net-share').value.trim(),
      user: $('bk-net-user').value.trim(),
      pass: $('bk-net-pass').value }) });
    const b = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(b.detail || ('HTTP ' + r.status));
    msg.innerHTML = '<span class="text-green-600">' + esc(b.detail) + '</span>';
    loadBackupsStep();
  } catch (e) { msg.innerHTML = '<span class="text-red-600">✗ ' + esc(e.message) + '</span>'; }
}

async function wizNetDisconnect() {
  const msg = $('bk-net-msg');
  try {
    const r = await authedFetch('/api/v1/settings/backups/net-unmount', { method: 'POST' });
    const b = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(b.detail || ('HTTP ' + r.status));
    msg.innerHTML = '<span class="text-gray-600">' + esc(b.detail) + '</span>';
    loadBackupsStep();
  } catch (e) { msg.innerHTML = '<span class="text-red-600">✗ ' + esc(e.message) + '</span>'; }
}

// ----- guided USB stick setup (host-side, LUKS) -----

function wizUsbMsg(text, ok) {
  const el = $('bk-usb-setup-msg');
  if (!el) return;
  el.innerHTML = '<span class="' + (ok === true ? 'text-green-700' : ok === false ? 'text-red-600' : 'text-amber-800') + '">' + esc(text) + '</span>';
}

async function wizUsbSetupList() {
  wizUsbMsg('detecting…');
  $('bk-usb-setup-result').classList.add('hidden');
  try {
    const r = await authedFetch('/api/v1/settings/backups/usb-setup', { method: 'POST', body: JSON.stringify({ action: 'list' }) });
    const b = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(b.detail || ('HTTP ' + r.status));
    const sel = $('bk-usb-dev');
    sel.innerHTML = '';
    (b.candidates || []).forEach(c => {
      const o = document.createElement('option');
      o.value = c.dev;
      o.textContent = c.dev + ' — ' + (c.size || '?') + (c.model ? ' · ' + c.model : '');
      sel.appendChild(o);
    });
    if (!(b.candidates || []).length) {
      wizUsbMsg(b.detail || 'No USB stick found — plug one into the Proxmox host, then retry.', false);
      $('bk-usb-picker').classList.add('hidden');
      return;
    }
    wizUsbMsg((b.candidates.length === 1 ? 'Found 1 stick — ' : 'Found ' + b.candidates.length + ' sticks — ') + 'pick one and confirm.', true);
    $('bk-usb-picker').classList.remove('hidden');
  } catch (e) { wizUsbMsg('✗ ' + e.message, false); }
}

async function wizUsbSetupRun() {
  const dev = $('bk-usb-dev').value;
  if (!dev) { wizUsbMsg('Pick a USB device first.', false); return; }
  if (!$('bk-usb-confirm').checked) { wizUsbMsg('Check the “erases the whole stick” box first.', false); return; }
  const result = $('bk-usb-setup-result');
  result.classList.remove('hidden');
  result.innerHTML = 'Erasing + encrypting <b>' + esc(dev) + '</b> on the host… this can take a minute.';
  wizUsbMsg('setting up…');
  try {
    const r = await authedFetch('/api/v1/settings/backups/usb-setup', { method: 'POST', body: JSON.stringify({ action: 'setup', dev: dev, confirm: true }) });
    const b = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(b.detail || ('HTTP ' + r.status));
    if (b.status === 'manual') {
      wizUsbMsg('See the command below.', false);
      result.innerHTML = '<p class="text-amber-800"><b>Run this on the Proxmox host</b> (the appliance couldn\'t automate it), then refresh Status:</p>'
        + '<pre class="mt-2 rounded bg-amber-100 p-2 font-mono text-xs break-all">' + esc(b.command || '') + '</pre>'
        + '<button onclick="loadBackupsStep()" class="mt-2 rounded-lg bg-amber-700 px-3 py-1 text-xs font-semibold text-white">Refresh status</button>';
      return;
    }
    if (b.status === 'error') {
      wizUsbMsg('✗ setup failed', false);
      result.innerHTML = '<p class="text-red-700"><b>Setup failed.</b></p>'
        + (b.output ? '<pre class="mt-2 rounded bg-gray-100 p-2 font-mono text-xs break-all">' + esc(b.output) + '</pre>' : '')
        + (b.command ? '<p class="mt-2">Manual fallback — run on the Proxmox host:<br><code class="break-all">' + esc(b.command) + '</code></p>' : '');
      return;
    }
    wizUsbMsg('✅ stick ready', true);
    let html = '<p class="text-green-700"><b>✅ USB stick is wiped + LUKS2-encrypted.</b></p>';
    if (b.recovery_passphrase) {
      html += '<p class="mt-2">Write this <b>recovery passphrase</b> on the rack card now — it is shown only once:</p>'
        + '<pre class="mt-2 rounded bg-gray-100 p-2 font-mono text-xs break-all">' + esc(b.recovery_passphrase) + '</pre>';
    }
    html += '<button onclick="loadBackupsStep()" class="mt-2 rounded-lg bg-amber-700 px-3 py-1 text-xs font-semibold text-white">Refresh status</button>';
    result.innerHTML = html;
  } catch (e) {
    wizUsbMsg('✗ ' + e.message, false);
    result.innerHTML = '<p class="text-red-700"><b>' + esc(e.message) + '</b></p>';
  }
}

// ----- navigation -----

function nextStep() {
  const s = steps()[cur];
  if (s.required && stepDone(s) !== true) {
    alert('Complete this step first — it\'s needed for the appliance to work. (' + s.title + ')');
    return;
  }
  advance();
}

function advance() {
  if (cur < steps().length - 1) { cur++; render(); }
  else { finishSetup(); }
}

function backStep() { if (cur > 0) { cur--; render(); } }
function skipStep() { advance(); }

// done dots are clickable (backward + between done steps); the current dot
// always is; anything ahead that isn't done stays locked (enforced order).
function jumpTo(i) {
  const target = steps()[i];
  if (!target) return;
  if (i === cur || stepDone(target) === true) { cur = i; render(); }
}

async function finishSetup() {
  // required steps block the finish; llm/devices/share/backups never do
  const undone = steps().filter(s => s.required && stepDone(s) !== true);
  if (undone.length) {
    const names = undone.map(s => s.title).join(', ');
    if (!confirm('You haven\'t set up: ' + names + '.\n\nYou can finish anyway and configure these later in Settings. Finish setup now?')) return;
  }
  const body = ADVANCED ? undefined : {
    timezone: validTz(detectedTZ) ? detectedTZ : undefined,
    site_name: expressSite || undefined,
    llm_egress: aiChoice || 'cloud',
  };
  try {
    await api('/api/v1/setup/complete', { method: 'POST', body: body ? JSON.stringify(body) : undefined });
    await loadStatus();
  } catch (e) { alert(e.message); }
}

loadStatus();
