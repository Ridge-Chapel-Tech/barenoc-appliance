{% extends "base.html" %}
{% block title %}BareNOC — LLM Monitor{% endblock %}
{% block inner_content %}
<div id="admin-app">
  <h1 class="text-2xl font-semibold text-gray-900">LLM Monitor</h1>
  <p class="mt-1 text-sm text-gray-500">Token usage, cost tracking, and configuration.</p>

  <!-- Period Selector -->
  <div class="mt-4 flex gap-2">
    <button data-range="1" onclick="loadUsage(1)" class="range-btn px-3 py-1 text-sm border rounded hover:bg-gray-50">24h</button>
    <button data-range="7" onclick="loadUsage(7)" class="range-btn px-3 py-1 text-sm border rounded hover:bg-gray-50 bg-barenoc-50 text-barenoc-700">7 days</button>
    <button data-range="30" onclick="loadUsage(30)" class="range-btn px-3 py-1 text-sm border rounded hover:bg-gray-50">30 days</button>
  </div>

  <!-- Summary Cards -->
  <div id="summary-cards" class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-4"></div>

  <!-- Daily Breakdown -->
  <div class="mt-6 bg-white shadow rounded-lg p-5">
    <h2 class="text-lg font-medium text-gray-900 mb-3">Daily Usage</h2>
    <div id="daily-chart" class="space-y-2"></div>
  </div>

  <!-- Model Breakdown -->
  <div class="mt-6 bg-white shadow rounded-lg p-5">
    <h2 class="text-lg font-medium text-gray-900 mb-3">By Model</h2>
    <div id="model-breakdown" class="space-y-2"></div>
  </div>

  <!-- Recent Activity -->
  <div class="mt-6 bg-white shadow rounded-lg p-5">
    <h2 class="text-lg font-medium text-gray-900 mb-3">Recent LLM Calls</h2>
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Ticket</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Title</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Model</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Conf</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Tokens</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Cost</th>
          <th class="px-4 py-2 text-left font-medium text-gray-500">Action</th>
        </tr>
      </thead>
      <tbody id="recent-table"></tbody>
    </table>
  </div>

  <!-- Config -->
  <div class="mt-6 bg-white shadow rounded-lg p-5">
    <h2 class="text-lg font-medium text-gray-900 mb-3">Configuration</h2>
    <div id="config-section" class="space-y-3"></div>
  </div>

  <div id="loading-admin" class="mt-4 text-center text-gray-500">Loading...</div>
</div>

<script>
function getToken() { return localStorage.getItem('access_token'); }

function fmtUsd(n) { return '$' + (n || 0).toFixed(6); }

// Range-button active state: the highlight must always match the fetched
// range. The active classes used to be hardcoded on the "7 days" button, so
// clicking 24h/30d changed the data while the highlight stayed stuck on 7d.
var RANGE_ACTIVE_CLASSES = ['bg-barenoc-50', 'text-barenoc-700'];
function setActiveRange(days) {
  document.querySelectorAll('.range-btn').forEach(function(btn) {
    var isActive = btn.getAttribute('data-range') === String(days);
    RANGE_ACTIVE_CLASSES.forEach(function(cls) {
      btn.classList.toggle(cls, isActive);
    });
  });
}

async function loadUsage(days) {
  days = days || 7;
  setActiveRange(days);
  document.getElementById('loading-admin').style.display = 'block';

  try {
    var resp = await fetch('/api/v1/admin/llm-usage?days=' + days, {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    var d = await resp.json();

    // Summary cards — honest empty state when the period has zero LLM calls.
    if (d.total_calls === 0) {
      document.getElementById('summary-cards').innerHTML = `
        <div class="bg-white shadow rounded-lg p-4 sm:col-span-4 text-center">
          <div class="text-sm text-gray-500">No LLM activity in the last ${d.period_days} days</div>
        </div>`;
    } else {
      document.getElementById('summary-cards').innerHTML = `
        <div class="bg-white shadow rounded-lg p-4"><div class="text-sm text-gray-500">Total Calls</div><div class="text-2xl font-semibold mt-1">${d.total_calls}</div></div>
        <div class="bg-white shadow rounded-lg p-4"><div class="text-sm text-gray-500">Total Tokens</div><div class="text-2xl font-semibold mt-1">${d.total_tokens.toLocaleString()}</div></div>
        <div class="bg-white shadow rounded-lg p-4"><div class="text-sm text-gray-500">Total Cost</div><div class="text-2xl font-semibold mt-1">${fmtUsd(d.total_cost_usd)}</div></div>
        <div class="bg-white shadow rounded-lg p-4"><div class="text-sm text-gray-500">Period</div><div class="text-2xl font-semibold mt-1">${d.period_days}d</div></div>
      `;
    }

    // Daily chart
    var chart = document.getElementById('daily-chart');
    chart.innerHTML = '';
    if (d.daily && d.daily.length) {
      var maxCost = Math.max(...d.daily.map(x => x.cost), 0.001);
      d.daily.forEach(function(day) {
        var pct = (day.cost / maxCost * 100).toFixed(0);
        chart.innerHTML += `
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-500 w-24">${day.date}</span>
            <div class="flex-1 bg-gray-100 rounded h-5 overflow-hidden">
              <div class="bg-barenoc-600 h-full rounded" style="width:${pct}%"></div>
            </div>
            <span class="text-xs text-gray-600 w-24 text-right">${day.calls} calls / ${fmtUsd(day.cost)}</span>
          </div>`;
      });
    } else {
      chart.innerHTML = '<p class="text-gray-400 text-sm">No LLM activity in the last ' + d.period_days + ' days.</p>';
    }

    // Model breakdown
    var models = document.getElementById('model-breakdown');
    models.innerHTML = '';
    var modelNames = d.by_model ? Object.keys(d.by_model) : [];
    if (modelNames.length) {
      modelNames.forEach(function(m) {
        var md = d.by_model[m];
        models.innerHTML += `<div class="flex justify-between text-sm py-1 border-b"><span class="font-medium">${m}</span><span>${md.calls} calls, ${md.tokens.toLocaleString()} tokens, ${fmtUsd(md.cost)}</span></div>`;
      });
    } else {
      models.innerHTML = '<p class="text-gray-400 text-sm">No LLM activity in the last ' + d.period_days + ' days.</p>';
    }

    // Recent activity
    var tbody = document.getElementById('recent-table');
    tbody.innerHTML = '';
    if (d.recent && d.recent.length) {
      d.recent.forEach(function(t) {
        tbody.innerHTML += `<tr class="hover:bg-gray-50">
          <td class="px-4 py-2 font-mono text-xs">${t.ticket_id}</td>
          <td class="px-4 py-2">${t.title}</td>
          <td class="px-4 py-2 text-xs">${t.model || '-'}</td>
          <td class="px-4 py-2">${t.confidence || '-'}</td>
          <td class="px-4 py-2">${t.tokens || 0}</td>
          <td class="px-4 py-2">${fmtUsd(t.cost)}</td>
          <td class="px-4 py-2">${t.action || '-'}</td>
        </tr>`;
      });
    } else {
      tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-400">No LLM activity in the last ' + d.period_days + ' days</td></tr>';
    }

    // Config
    var configResp = await fetch('/api/v1/admin/config', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    var cfg = await configResp.json();
    document.getElementById('config-section').innerHTML = `
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div><span class="font-medium">Chat Model:</span> ${cfg.chat_model}</div>
        <div><span class="font-medium">Reasoner Model:</span> ${cfg.reasoner_model}</div>
        <div><span class="font-medium">API Key:</span> ${cfg.has_api_key ? '✅ Configured' : '❌ Not set'}</div>
        <div><span class="font-medium">Session Expiry:</span> ${cfg.access_token_expire_minutes} min</div>
      </div>
    `;

  } catch (err) {
    console.error(err);
    document.getElementById('summary-cards').innerHTML = '<div class="text-red-500">Failed to load LLM data</div>';
  }
  document.getElementById('loading-admin').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', function() { loadUsage(7); });
</script>
{% endblock %}
